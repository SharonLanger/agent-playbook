<svg id="flowsvg" width="846" viewBox="0 0 846 370" role="img" aria-roledescription="architecture diagram" aria-labelledby="flowsvg-title" aria-describedby="flowsvg-desc" xmlns="http://www.w3.org/2000/svg" height="370"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; background: #020617;
         min-height: 100vh; padding: 2rem; color: #e2e8f0; }
  .container { max-width: 1100px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 0.4rem; }
  .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: #22d3ee; }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  .subtitle { color: #64748b; font-size: 0.8rem; margin-bottom: 1.5rem; }
  .diagram-card { border: 1px solid #1e293b; border-radius: 12px; position: relative;
    background: repeating-linear-gradient(0deg, #0f1b33 0 0.5px, transparent 0.5px 40px),
      repeating-linear-gradient(90deg, #0f1b33 0 0.5px, transparent 0.5px 40px), #030a1c;
    padding: 1.25rem 1rem; }
  .pause-btn { position: absolute; top: 12px; right: 12px; z-index: 2; background: transparent;
    border: 1px solid #1e293b; color: #64748b; border-radius: 6px; padding: 4px 10px;
    font: inherit; font-size: 11px; cursor: pointer; }
  .pause-btn:hover { color: #e2e8f0; border-color: #334155; }
  .footer { color: #475569; font-size: 0.7rem; margin-top: 1rem; }
  .flow { stroke-dasharray: 5 5; }
  .flow-async { stroke-dasharray: 2 4; }
  .flow-auth { stroke-dasharray: 4 4; }
  @media (prefers-reduced-motion: no-preference) {
    .flow { animation: dashmove 0.75s linear infinite; }
    .flow-async { animation: dashasync 0.9s linear infinite; }
    .flow-auth { animation: dashauth 1.2s linear infinite; }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }
  }
  @keyframes dashmove { to { stroke-dashoffset: -10; } }
  @keyframes dashasync { to { stroke-dashoffset: -12; } }
  @keyframes dashauth { to { stroke-dashoffset: -8; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  body.paused .flow, body.paused .flow-async, body.paused .flow-auth,
  body.paused .pulse-dot { animation-play-state: paused; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem; margin-top: 1.25rem; }
  .card { border: 1px solid #1e293b; border-radius: 10px; background: #060d20; padding: 1rem 1.1rem; }
  .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 0.6rem; }
  .card-dot { width: 8px; height: 8px; border-radius: 50%; }
  .card-dot.cyan { background: #22d3ee; } .card-dot.violet { background: #a78bfa; }
  .card-dot.rose { background: #fb7185; }
  .card h3 { font-size: 0.8rem; font-weight: 600; }
  .card ul { list-style: none; } .card li { font-size: 0.72rem; color: #94a3b8; line-height: 1.7; }

svg{background:#020617;}
@media (prefers-reduced-motion: reduce){.dot{display:none!important;}.flow,.flow-async,.flow-auth,.pulse-dot{animation:none!important;}}
</style><title id="flowsvg-title">Stage 01 · Shared shell, independent workflows animated diagram</title><desc id="flowsvg-desc">Top-down architecture diagram; dashed connectors animate in the direction of flow and dots ride the main paths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><g fill="none"><path class="flow" d="M423 90 V142" stroke="#64748b" stroke-width="1" opacity="1" marker-end="url(#arrow)" /><path class="flow" d="M423 202 V230 H146 V254" stroke="#64748b" stroke-width="1" opacity="1" marker-end="url(#arrow)" /><path class="flow" d="M423 202 V230 H424.5 V254" stroke="#64748b" stroke-width="1" opacity="1" marker-end="url(#arrow)" /><path class="flow" d="M423 202 V230 H701.5 V254" stroke="#64748b" stroke-width="1" opacity="1" marker-end="url(#arrow)" /></g><text x="294.5" y="227" fill="#64748b" font-size="10">one selected</text><text x="431" y="225.8" fill="#64748b" font-size="10">one selected</text><text x="568.2" y="227" fill="#64748b" font-size="10">one selected</text><g><circle r="3.5" class="dot" fill="#22d3ee"><animateMotion id="j0_0" dur="0.6s" begin="0s;j0_1.end+0.6s" fill="freeze" path="M423 90 V142" /></circle><circle r="3.5" class="dot" fill="#22d3ee"><animateMotion id="j0_1" dur="0.6s" begin="j0_0.end+0.3s" fill="freeze" path="M423 202 V230 H424.5 V254" /></circle></g><g font-family="JetBrains Mono, ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle"><rect x="272" y="34" width="302" height="56" rx="8" fill="#0b1226" data-grp="" /><rect x="272" y="34" width="302" height="56" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5" data-grp="" /><text x="423" y="57" fill="#e2e8f0" font-size="13" font-weight="500">CLI / PyCharm</text><text x="423" y="80" fill="#64748b" font-size="10">REUSABLE · selection and presentation</text><rect x="283" y="146" width="280" height="56" rx="8" fill="#0b1226" data-grp="" /><rect x="283" y="146" width="280" height="56" rx="8" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1.5" data-grp="" /><text x="423" y="169" fill="#e2e8f0" font-size="13" font-weight="500">Application runner</text><text x="423" y="192" fill="#64748b" font-size="10">REUSABLE · validate, select, report</text><rect x="34" y="258" width="224" height="56" rx="8" fill="#0b1226" data-grp="" /><rect x="34" y="258" width="224" height="56" rx="8" fill="rgba(76,29,149,0.45)" stroke="#a78bfa" stroke-width="1.5" data-grp="" /><text x="146" y="281" fill="#e2e8f0" font-size="13" font-weight="500">WF-01 · Sequence</text><text x="146" y="304" fill="#64748b" font-size="10">SPECIFIC · message result</text><rect x="298" y="258" width="253" height="56" rx="8" fill="#0b1226" data-grp="" /><rect x="298" y="258" width="253" height="56" rx="8" fill="rgba(76,29,149,0.45)" stroke="#a78bfa" stroke-width="1.5" data-grp="" /><text x="424.5" y="281" fill="#e2e8f0" font-size="13" font-weight="500">WF-02 · State</text><text x="424.5" y="304" fill="#64748b" font-size="10">SPECIFIC · number and history</text><rect x="591" y="258" width="221" height="56" rx="8" fill="#0b1226" data-grp="" /><rect x="591" y="258" width="221" height="56" rx="8" fill="rgba(76,29,149,0.45)" stroke="#a78bfa" stroke-width="1.5" data-grp="" /><text x="701.5" y="281" fill="#e2e8f0" font-size="13" font-weight="500">WF-03 · Route</text><text x="701.5" y="304" fill="#64748b" font-size="10">SPECIFIC · score decision</text></g><g font-family="JetBrains Mono, ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="11"><rect x="34" y="320" width="12" height="12" rx="3" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" /><text x="52" y="330" fill="#94a3b8" font-size="11">entry</text><rect x="145" y="320" width="12" height="12" rx="3" fill="rgba(6,78,59,0.45)" stroke="#34d399" /><text x="163" y="330" fill="#94a3b8" font-size="11">shared</text><rect x="248" y="320" width="12" height="12" rx="3" fill="rgba(76,29,149,0.45)" stroke="#a78bfa" /><text x="266" y="330" fill="#94a3b8" font-size="11">workflow</text><circle cx="333" cy="326" r="3.5" fill="#22d3ee" /><text x="343" y="330" fill="#94a3b8" font-size="11">run journey</text></g></svg>
