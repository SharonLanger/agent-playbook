<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Follow the execution</title><desc id="desc">Observation flow • connect the workflow run, its steps and agent sessions. Animation illustrates direction only; this is an architecture diagram, not live execution data.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1725"/><stop offset="1" stop-color="#15263a"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif} .pulse{filter:none} @media(prefers-reduced-motion:reduce){.pulse{display:none}}</style>
<rect width="1200" height="900" rx="24" fill="url(#bg)"/>
<text x="40" y="43" fill="#69d9ce" font-size="13" font-weight="700" letter-spacing="2">AGENT PLAYBOOK  /  03</text>
<text x="40" y="91" fill="#f1f6fc" font-size="34" font-weight="700">Follow the execution</text>
<text x="40" y="125" fill="#a2b7ca" font-size="17">Observation flow • connect the workflow run, its steps and agent sessions</text>
<path d="M190 290 V360 H530 V410" fill="none" stroke="#b4a3ff" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="237" y="333" width="93.0" height="24" rx="5" fill="#101e2e"/><text x="245" y="350" fill="#b4a3ff" font-size="14">run events</text>
<circle class="pulse" r="4" fill="#b4a3ff"><animateMotion path="M190 290 V360 H530 V410" dur="3.6s" begin="0.0s" repeatCount="indefinite"/></circle>
<path d="M600 290 V410" fill="none" stroke="#b4a3ff" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="607" y="331" width="100.7" height="24" rx="5" fill="#101e2e"/><text x="615" y="348" fill="#b4a3ff" font-size="14">step events</text>
<circle class="pulse" r="4" fill="#b4a3ff"><animateMotion path="M600 290 V410" dur="3.6s" begin="-0.47s" repeatCount="indefinite"/></circle>
<path d="M1010 290 V360 H670 V410" fill="none" stroke="#b4a3ff" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="809" y="333" width="108.4" height="24" rx="5" fill="#101e2e"/><text x="817" y="350" fill="#b4a3ff" font-size="14">agent events</text>
<circle class="pulse" r="4" fill="#b4a3ff"><animateMotion path="M1010 290 V360 H670 V410" dur="3.6s" begin="-0.94s" repeatCount="indefinite"/></circle>
<path d="M600 510 V630" fill="none" stroke="#b4a3ff" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="607" y="561" width="62.2" height="24" rx="5" fill="#101e2e"/><text x="615" y="578" fill="#b4a3ff" font-size="14">export</text>
<circle class="pulse" r="4" fill="#b4a3ff"><animateMotion path="M600 510 V630" dur="3.6s" begin="-1.41s" repeatCount="indefinite"/></circle>
<rect x="40" y="190" width="300" height="100" rx="12" fill="#192b40" stroke="#69d9ce" stroke-opacity=".6"/><rect x="41" y="207" width="4" height="66" rx="2" fill="#69d9ce"/><text x="60" y="222" fill="#f1f6fc" font-size="19" font-weight="700">Application runner</text>
<text x="60" y="248" fill="#b9cada" font-size="15">Run started / completed / failed</text>
<text x="60" y="270" fill="#b9cada" font-size="15">run_id</text>
<rect x="450" y="190" width="300" height="100" rx="12" fill="#192b40" stroke="#69d9ce" stroke-opacity=".6"/><rect x="451" y="207" width="4" height="66" rx="2" fill="#69d9ce"/><text x="470" y="222" fill="#f1f6fc" font-size="19" font-weight="700">Workflow steps</text>
<text x="470" y="248" fill="#b9cada" font-size="15">Step start, result, error</text>
<text x="470" y="270" fill="#b9cada" font-size="15">run_id + step_id</text>
<rect x="860" y="190" width="300" height="100" rx="12" fill="#192b40" stroke="#f5ba77" stroke-opacity=".6"/><rect x="861" y="207" width="4" height="66" rx="2" fill="#f5ba77"/><text x="880" y="222" fill="#f1f6fc" font-size="19" font-weight="700">Agent adapter</text>
<text x="880" y="248" fill="#b9cada" font-size="15">Execution and session events</text>
<text x="880" y="270" fill="#b9cada" font-size="15">run_id + step_id + session_id</text>
<rect x="450" y="410" width="300" height="100" rx="12" fill="#192b40" stroke="#b4a3ff" stroke-opacity=".6"/><rect x="451" y="427" width="4" height="66" rx="2" fill="#b4a3ff"/><text x="470" y="442" fill="#f1f6fc" font-size="19" font-weight="700">Observability boundary</text>
<text x="470" y="468" fill="#b9cada" font-size="15">Normalize, correlate, redact</text>
<text x="470" y="490" fill="#b9cada" font-size="15">Publish through selected adapter</text>
<rect x="450" y="630" width="300" height="100" rx="12" fill="#192b40" stroke="#b4a3ff" stroke-opacity=".6"/><rect x="451" y="647" width="4" height="66" rx="2" fill="#b4a3ff"/><text x="470" y="662" fill="#f1f6fc" font-size="19" font-weight="700">Langfuse trace</text>
<text x="470" y="688" fill="#b9cada" font-size="15">Run → step → agent spans</text>
<text x="470" y="710" fill="#b9cada" font-size="15">Inspect timing, status and errors</text>
<rect x="860" y="630" width="300" height="100" rx="12" fill="#192b40" stroke="#a2b7ca" stroke-opacity=".6"/><rect x="861" y="647" width="4" height="66" rx="2" fill="#a2b7ca"/><text x="880" y="662" fill="#f1f6fc" font-size="19" font-weight="700">Workflow state</text>
<text x="880" y="688" fill="#b9cada" font-size="15">Owned by workflow execution</text>
<text x="880" y="710" fill="#b9cada" font-size="15">Not reconstructed from traces</text>
<line x1="40" y1="800" x2="1160" y2="800" stroke="#34475c"/>
<text x="40" y="830" fill="#b9cada" font-size="15">Traces explain execution. They do not schedule steps or control the workflow.</text>
<text x="40" y="854" fill="#b9cada" font-size="15">Telemetry failure handling, redaction rules and retention limits must be specified before integration is accepted.</text>
</svg>