<svg xmlns="http://www.w3.org/2000/svg" width="545" height="687" viewBox="0 0 545 687" role="img" aria-labelledby="title desc"><title id="title">From approved design to authorized merge</title><desc id="desc">Required corrections return to the coder for a new frozen candidate and both reviews. Three rounds maximum before a decision.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#405b68" stroke-width="1.2"/></marker></defs><rect x="1" y="1" width="543" height="685" rx="10" fill="#f7f9f7" stroke="#cad4d2" stroke-width="1.4" /><text x="22" y="33" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172e40">One candidate, two independent reviews</text><rect x="105" y="50" width="335" height="64" rx="10" fill="#e7eef6" stroke="#7d99b4" stroke-width="1.4" /><text x="272.5" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172e40">Maintainer approves revision</text><text x="272.5" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#405b68">Design · test cases · implementation plan</text><path d="M272 114 V133" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="130" y="135" width="285" height="40" rx="10" fill="#fff" stroke="#92a8aa" stroke-width="1.4" /><text x="272.5" y="162.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172e40">Coding agent</text><path d="M272 175 V193" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="130" y="195" width="285" height="42" rx="10" fill="#fff" stroke="#92a8aa" stroke-width="1.4" /><text x="272.5" y="223.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172e40">Freeze code and tests</text><path d="M272 237 V250 H152 V267" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M272 250 H395 V267" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="269" width="205" height="60" rx="10" fill="#e2f3eb" stroke="#589387" stroke-width="1.4" /><text x="152.5" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172e40">Design drift</text><text x="152.5" y="319" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#405b68">Contract and boundaries</text><rect x="290" y="269" width="210" height="60" rx="10" fill="#e2f3eb" stroke="#589387" stroke-width="1.4" /><text x="395.0" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172e40">Test quality</text><text x="395.0" y="319" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#405b68">Behavior and assertions</text><path d="M152 329 V345 H241 V359" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M395 329 V345 H303 V359" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="130" y="361" width="285" height="44" rx="10" fill="#fff" stroke="#92a8aa" stroke-width="1.4" /><text x="272.5" y="390.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172e40">Consolidate findings</text><path d="M130 383 H28 V155 H128" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="37" y="185" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#405b68">Fixes</text><text x="37" y="206" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#405b68">needed</text><path d="M272 405 V443" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="285" y="434" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#116b63">Both pass</text><rect x="80" y="445" width="385" height="62" rx="10" fill="#fff" stroke="#92a8aa" stroke-width="1.4" /><text x="272.5" y="471" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172e40">Final design review</text><text x="272.5" y="495" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#405b68">Inspect the diff and verification evidence</text><path d="M272 507 V527" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="80" y="529" width="385" height="62" rx="10" fill="#e7eef6" stroke="#7d99b4" stroke-width="1.4" /><text x="272.5" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172e40">Maintainer decision</text><text x="272.5" y="579" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#405b68">Accept the outcome, then authorize merge</text><rect x="22" y="608" width="501" height="61" rx="10" fill="#fff1dc" stroke="#b68b4f" stroke-width="1.4" /><text x="38" y="633" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#172e40">Up to three rounds</text><text x="38" y="655" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#405b68">Still open after round three? Stop for a decision.</text></svg>
