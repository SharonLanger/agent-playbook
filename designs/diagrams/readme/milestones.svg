<svg xmlns="http://www.w3.org/2000/svg" width="545" height="367" viewBox="0 0 545 367" role="img" aria-labelledby="title desc"><title id="title">How a stage becomes verifiable milestones</title><desc id="desc">The context milestone supplies shared identity to workflow tracing and to a separate logging refactor.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#405b68" stroke-width="1.2"/></marker></defs><rect x="1" y="1" width="543" height="365" rx="10" fill="#f7f9f7" stroke="#cad4d2" stroke-width="1.4" /><text x="22" y="34" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172e40">Stage 02 · Workflow observability</text><rect x="22" y="51" width="501" height="66" rx="10" fill="#ffffff" stroke="#92a8aa" stroke-width="1.4" /><text x="36" y="78" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172e40">M1–M3  /  Local Langfuse</text><text x="36" y="103" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#405b68">Can a developer inspect a trace locally?</text><path d="M272 117 V139" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="22" y="141" width="501" height="66" rx="10" fill="#e2f3eb" stroke="#589387" stroke-width="1.4" /><text x="36" y="168" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172e40">M4.1  /  Execution context</text><text x="36" y="193" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#405b68">Carry one identity from the runner into the Flow.</text><path d="M272 207 V224 H146 V246" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M272 224 H402 V246" fill="none" stroke="#405b68" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="22" y="248" width="244" height="70" rx="10" fill="#ffffff" stroke="#92a8aa" stroke-width="1.4" /><text x="36" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172e40">M4.2–3  /  Tracing</text><text x="36" y="300" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#405b68">Observe the executed steps.</text><rect x="279" y="248" width="244" height="70" rx="10" fill="#e7eef6" stroke="#7d99b4" stroke-width="1.4" /><text x="293" y="275" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172e40">Logging refactor</text><text x="293" y="300" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#405b68">Correlate application logs.</text><text x="23" y="350" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#405b68">Stage milestone</text><text x="280" y="350" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#405b68">Independent workstream</text></svg>
