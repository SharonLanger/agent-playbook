<svg xmlns="http://www.w3.org/2000/svg" width="545" height="371" viewBox="0 0 545 371" role="img" aria-labelledby="title desc"><title id="title">Implemented architecture</title><desc id="desc">The runner and CrewAI workflows share execution identity with tracing and logging. An adapter boundary is in design for future agent execution.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#405b68" stroke-width="1.2"/></marker></defs><rect x="1" y="1" width="543" height="369" rx="10" fill="#f7f9f7" stroke="#cad4d2" stroke-width="1.4" /><text x="22" y="32" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#116b63">Implemented architecture</text><rect x="22" y="48" width="243" height="67" rx="10" fill="#ffffff" stroke="#92a8aa" stroke-width="1.4" /><text x="36" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172e40">Application runner</text><text x="36" y="100" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#405b68">Selection and lifecycle</text><rect x="280" y="48" width="243" height="67" rx="10" fill="#ffffff" stroke="#92a8aa" stroke-width="1.4" /><text x="294" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172e40">CrewAI Flows</text><text x="294" y="100" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#405b68">Steps, state and routing</text><text x="24" y="149" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#405b68">Inspect the same run by correlation ID</text><rect x="22" y="164" width="243" height="67" rx="10" fill="#e2f3eb" stroke="#589387" stroke-width="1.4" /><text x="36" y="191" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172e40">Langfuse</text><text x="36" y="216" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#405b68">Workflow and step traces</text><rect x="280" y="164" width="243" height="67" rx="10" fill="#e2f3eb" stroke="#589387" stroke-width="1.4" /><text x="294" y="191" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172e40">VictoriaLogs</text><text x="294" y="216" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#405b68">Structured logs via OTLP</text><text x="22" y="267" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#635088">Agent execution · in design</text><rect x="22" y="283" width="501" height="68" rx="10" fill="#f2edfa" stroke="#9885b4" stroke-width="1.4" stroke-dasharray="6 4"/><text x="36" y="310" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172e40">Adapter and event-mapping contracts</text><text x="36" y="335" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#405b68">Planned native integrations: Codex and Claude</text></svg>
