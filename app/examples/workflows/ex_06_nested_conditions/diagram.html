<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wait for A and either B or C — dashmotion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; background: #020617;
         min-height: 100vh; padding: 2rem; color: #e2e8f0; }
  .container { max-width: 960px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 0.4rem; }
  .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  .subtitle { color: #64748b; font-size: 0.8rem; margin-bottom: 1.5rem; }
  .diagram-card { border: 1px solid #1e293b; border-radius: 12px; position: relative;
    background: repeating-linear-gradient(0deg, #0f1b33 0 0.5px, transparent 0.5px 40px),
      repeating-linear-gradient(90deg, #0f1b33 0 0.5px, transparent 0.5px 40px), #030a1c;
    padding: 1.25rem 1rem; }
  .pause-btn { position: absolute; top: 12px; right: 12px; z-index: 2; background: transparent;
    border: 1px solid #1e293b; color: #64748b; border-radius: 6px; padding: 4px 10px;
    font: inherit; font-size: 11px; cursor: pointer; }
  .pause-btn:hover { color: #e2e8f0; border-color: #334155; }
  .footer { color: #475569; font-size: 0.7rem; margin-top: 1rem; }
  .flow { stroke-dasharray: 5 5; }
  .flow-async { stroke-dasharray: 2 4; }
  .flow-auth { stroke-dasharray: 4 4; }
  @media (prefers-reduced-motion: no-preference) {
    .flow { animation: dashmove 0.75s linear infinite; }
    .flow-async { animation: dashasync 0.9s linear infinite; }
    .flow-auth { animation: dashauth 1.2s linear infinite; }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }
  }
  @keyframes dashmove { to { stroke-dashoffset: -10; } }
  @keyframes dashasync { to { stroke-dashoffset: -12; } }
  @keyframes dashauth { to { stroke-dashoffset: -8; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  body.paused .flow, body.paused .flow-async, body.paused .flow-auth,
  body.paused .pulse-dot { animation-play-state: paused; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><div class="pulse-dot"></div><h1>Wait for A and either B or C</h1></div>
  <p class="subtitle">Possible trigger paths; motion illustrates direction, not timing.</p>
  <div class="diagram-card">
    <button class="pause-btn" id="pauseBtn" aria-pressed="false">⏸ pause</button>
    <svg id="flowsvg" width="100%" viewBox="0 0 458 322" role="img" aria-roledescription="flowchart" aria-labelledby="flowsvg-title" aria-describedby="flowsvg-desc"><title id="flowsvg-title">Wait for A and either B or C animated diagram</title><desc id="flowsvg-desc">Top-down flow diagram; dashed connectors animate in the direction of flow and dots ride the main paths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g fill="none"><path class="flow" d="M89 78 V210 H229 V230" stroke="#10b981" stroke-width="1.5" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M229 78 V130" stroke="#10b981" stroke-width="1.5" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M369 78 V106 H229 V130" stroke="#10b981" stroke-width="1.5" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M229 178 V230" stroke="#10b981" stroke-width="1.5" opacity="0.85" marker-end="url(#arrow)"/></g><text x="89.0" y="96.0" text-anchor="middle" font-family="monospace" fill="#94a3b8" font-size="10">A</text><text x="229.0" y="96.0" text-anchor="middle" font-family="monospace" fill="#94a3b8" font-size="10">B</text><text x="369.0" y="96.0" text-anchor="middle" font-family="monospace" fill="#94a3b8" font-size="10">C</text><text x="229.0" y="196.0" text-anchor="middle" font-family="monospace" fill="#94a3b8" font-size="10">B or C</text><g></g><g font-family="JetBrains Mono, ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle"><rect x="34" y="34" width="110" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="89" y="60" fill="#e2e8f0" font-size="13" font-weight="500">a</text><rect x="174" y="234" width="110" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="229" y="260" fill="#e2e8f0" font-size="13" font-weight="500">joined</text><rect x="174" y="34" width="110" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="229" y="60" fill="#e2e8f0" font-size="13" font-weight="500">b</text><rect x="174" y="134" width="110" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="229" y="160" fill="#e2e8f0" font-size="13" font-weight="500">either</text><rect x="314" y="34" width="110" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="369" y="60" fill="#e2e8f0" font-size="13" font-weight="500">c</text></g></svg>
  </div>
  
  <p class="footer">dashmotion · flow mode · deterministic layout</p>
</div>

<script>
(function () {
  var svg = document.getElementById('flowsvg');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.dot').forEach(function (d) { d.remove(); });
    var b = document.getElementById('pauseBtn'); if (b) b.remove(); return;
  }
  var btn = document.getElementById('pauseBtn'); var paused = false;
  btn.addEventListener('click', function () {
    paused = !paused; document.body.classList.toggle('paused', paused);
    paused ? svg.pauseAnimations() : svg.unpauseAnimations();
    btn.textContent = paused ? '▶ play' : '⏸ pause';
    btn.setAttribute('aria-pressed', String(paused));
  });
})();
</script>

</body>
</html>
