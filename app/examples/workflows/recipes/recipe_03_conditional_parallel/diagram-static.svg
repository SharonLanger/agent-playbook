<svg xmlns="http://www.w3.org/2000/svg" id="flowsvg" width="100%" viewBox="0 0 483 522" role="img" aria-roledescription="flowchart" aria-labelledby="flowsvg-title" aria-describedby="flowsvg-desc"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; background: #020617;
         min-height: 100vh; padding: 2rem; color: #e2e8f0; }
  .container { max-width: 960px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 0.4rem; }
  .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  .subtitle { color: #64748b; font-size: 0.8rem; margin-bottom: 1.5rem; }
  .diagram-card { border: 1px solid #1e293b; border-radius: 12px; position: relative;
    background: repeating-linear-gradient(0deg, #0f1b33 0 0.5px, transparent 0.5px 40px),
      repeating-linear-gradient(90deg, #0f1b33 0 0.5px, transparent 0.5px 40px), #030a1c;
    padding: 1.25rem 1rem; }
  .pause-btn { position: absolute; top: 12px; right: 12px; z-index: 2; background: transparent;
    border: 1px solid #1e293b; color: #64748b; border-radius: 6px; padding: 4px 10px;
    font: inherit; font-size: 11px; cursor: pointer; }
  .pause-btn:hover { color: #e2e8f0; border-color: #334155; }
  .footer { color: #475569; font-size: 0.7rem; margin-top: 1rem; }
  .flow { stroke-dasharray: 5 5; }
  .flow-async { stroke-dasharray: 2 4; }
  .flow-auth { stroke-dasharray: 4 4; }
  @media (prefers-reduced-motion: no-preference) {
    .flow { animation: none; }
    .flow-async { animation: none; }
    .flow-auth { animation: none; }
    .pulse-dot { animation: none; }
  }
  @keyframes dashmove { to { stroke-dashoffset: -10; } }
  @keyframes dashasync { to { stroke-dashoffset: -12; } }
  @keyframes dashauth { to { stroke-dashoffset: -8; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  body.paused .flow, body.paused .flow-async, body.paused .flow-auth,
  body.paused .pulse-dot { animation-play-state: paused; }
</style><rect width="483" height="522" fill="#020617"/><title id="flowsvg-title">Choose the route first animated diagram</title><desc id="flowsvg-desc">Top-down flow diagram; dashed connectors animate in the direction of flow and dots ride the main paths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g fill="none"><path class="flow" d="M256.5 78 V106 H155 V130" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M256.5 78 V106 H362.5 V130" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M362.5 178 V206 H177.5 V230" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M362.5 178 V206 H335 V230" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M177.5 278 V306 H256.5 V330" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M335 278 V306 H256.5 V330" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M155 178 V202 H34 V406 H256.5 V430" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M256.5 378 V430" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/></g><text x="215.8" y="103" fill="#64748b" font-size="10">basic</text><text x="315.5" y="103" fill="#64748b" font-size="10">detailed</text><g></g><g font-family="JetBrains Mono, ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle"><rect x="196.5" y="34" width="120" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981" stroke-dasharray="4 3"/><text x="256.5" y="60" fill="#e2e8f0" font-size="13" font-weight="500">Choose mode</text><rect x="64" y="134" width="182" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="155" y="160" fill="#e2e8f0" font-size="13" font-weight="500">Basic · Calculate sum</text><rect x="276" y="134" width="173" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="362.5" y="160" fill="#e2e8f0" font-size="13" font-weight="500">Detailed · Start both</text><rect x="114" y="234" width="127" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="177.5" y="260" fill="#e2e8f0" font-size="13" font-weight="500">Calculate sum</text><rect x="271" y="234" width="128" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="335" y="260" fill="#e2e8f0" font-size="13" font-weight="500">Find maximum</text><rect x="157.5" y="334" width="198" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="256.5" y="360" fill="#e2e8f0" font-size="13" font-weight="500">Wait for both · Combine</text><rect x="198.5" y="434" width="116" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="256.5" y="460" fill="#e2e8f0" font-size="13" font-weight="500">Final report</text></g></svg>
