<svg xmlns="http://www.w3.org/2000/svg" id="flowsvg" width="100%" viewBox="0 0 474 622" role="img" aria-roledescription="flowchart" aria-labelledby="flowsvg-title" aria-describedby="flowsvg-desc"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; background: #020617;
         min-height: 100vh; padding: 2rem; color: #e2e8f0; }
  .container { max-width: 960px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 0.4rem; }
  .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; }
  h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  .subtitle { color: #64748b; font-size: 0.8rem; margin-bottom: 1.5rem; }
  .diagram-card { border: 1px solid #1e293b; border-radius: 12px; position: relative;
    background: repeating-linear-gradient(0deg, #0f1b33 0 0.5px, transparent 0.5px 40px),
      repeating-linear-gradient(90deg, #0f1b33 0 0.5px, transparent 0.5px 40px), #030a1c;
    padding: 1.25rem 1rem; }
  .pause-btn { position: absolute; top: 12px; right: 12px; z-index: 2; background: transparent;
    border: 1px solid #1e293b; color: #64748b; border-radius: 6px; padding: 4px 10px;
    font: inherit; font-size: 11px; cursor: pointer; }
  .pause-btn:hover { color: #e2e8f0; border-color: #334155; }
  .footer { color: #475569; font-size: 0.7rem; margin-top: 1rem; }
  .flow { stroke-dasharray: 5 5; }
  .flow-async { stroke-dasharray: 2 4; }
  .flow-auth { stroke-dasharray: 4 4; }
  @media (prefers-reduced-motion: no-preference) {
    .flow { animation: dashmove 0.75s linear infinite; }
    .flow-async { animation: dashasync 0.9s linear infinite; }
    .flow-auth { animation: dashauth 1.2s linear infinite; }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }
  }
  @keyframes dashmove { to { stroke-dashoffset: -10; } }
  @keyframes dashasync { to { stroke-dashoffset: -12; } }
  @keyframes dashauth { to { stroke-dashoffset: -8; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  body.paused .flow, body.paused .flow-async, body.paused .flow-auth,
  body.paused .pulse-dot { animation-play-state: paused; }
</style><rect width="474" height="622" fill="#020617"/><title id="flowsvg-title">Let the result choose the route animated diagram</title><desc id="flowsvg-desc">Top-down flow diagram; dashed connectors animate in the direction of flow and dots ride the main paths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g fill="none"><path class="flow" d="M252 78 V130" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M252 178 V206 H129 V230" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M252 178 V206 H332 V230" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M332 278 V306 H173 V330" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M332 278 V306 H329.5 V330" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M173 378 V406 H252 V430" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M329.5 378 V406 H252 V430" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M129 278 V302 H34 V506 H252 V530" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/><path class="flow" d="M252 478 V530" stroke="#10b981" stroke-width="1" opacity="0.85" marker-end="url(#arrow)"/></g><text x="200.5" y="203" fill="#64748b" font-size="10">no</text><text x="298" y="203" fill="#64748b" font-size="10">yes</text><g></g><g font-family="JetBrains Mono, ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" text-anchor="middle"><rect x="188.5" y="34" width="127" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="252" y="60" fill="#e2e8f0" font-size="13" font-weight="500">Calculate sum</text><rect x="185.5" y="134" width="133" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981" stroke-dasharray="4 3"/><text x="252" y="160" fill="#e2e8f0" font-size="13" font-weight="500">Sum above 10?</text><rect x="64" y="234" width="130" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="129" y="260" fill="#e2e8f0" font-size="13" font-weight="500">Keep sum only</text><rect x="224" y="234" width="216" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="332" y="260" fill="#e2e8f0" font-size="13" font-weight="500">More analysis · Start both</text><rect x="110.5" y="334" width="125" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="173" y="360" fill="#e2e8f0" font-size="13" font-weight="500">Find minimum</text><rect x="265.5" y="334" width="128" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="329.5" y="360" fill="#e2e8f0" font-size="13" font-weight="500">Find maximum</text><rect x="153" y="434" width="198" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="252" y="460" fill="#e2e8f0" font-size="13" font-weight="500">Wait for both · Combine</text><rect x="194" y="534" width="116" height="44" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10b981"/><text x="252" y="560" fill="#e2e8f0" font-size="13" font-weight="500">Final report</text></g></svg>
