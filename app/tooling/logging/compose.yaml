name: agent-playbook-logging-smoke

services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=7d"
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - logs-data:/victoria-logs-data
    networks:
      - logs-local
    logging:
      driver: local

volumes:
  logs-data:
    driver: local

networks:
  logs-local:
    internal: true
