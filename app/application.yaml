integrations:
  crewai:
    usage_telemetry_enabled: false
    tracing_enabled: false
    show_framework_events: true
  logging:
    enabled: true
    level: DEBUG
    endpoint: http://127.0.0.1:9428/insert/opentelemetry/v1/logs
  langfuse:
    enabled: true
    base_url: http://localhost:3000
    environment: local
    public_key: {env: LANGFUSE_PUBLIC_KEY}
    secret_key: {env: LANGFUSE_SECRET_KEY}
secrets:
  file: ~/.config/agent-playbook/secrets.env
workflows:
  wf-01:
    name: Step sequence
    implementation: step_sequence
  wf-02:
    name: Shared state
    implementation: shared_state
  wf-03:
    name: Conditional route
    implementation: conditional_route
