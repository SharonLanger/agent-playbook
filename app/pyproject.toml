[project]
name = "agent-playbook"
version = "0.1.3"
description = "Incremental agent orchestration learning sandbox"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai==1.15.40",
    "httpx==0.28.1",
    "langfuse==5.2.0",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
]

[project.scripts]
agent-playbook = "agent_playbook.cli:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.6"
constraint-dependencies = ["uv==0.13.6"]

[dependency-groups]
dev = ["pyright==1.1.407", "pytest==8.4.2", "ruff==0.14.4"]

[tool.pyright]
include = ["src", "tooling", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

