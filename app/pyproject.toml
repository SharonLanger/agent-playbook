[project]
name = "agent-playbook"
version = "0.0.0"
description = "Incremental agent orchestration learning sandbox"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
agent-playbook = "agent_playbook.cli:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.6"

[dependency-groups]
dev = ["pyright==1.1.407"]

[tool.pyright]
include = ["src", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
