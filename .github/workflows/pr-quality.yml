name: PR quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: PR quality
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Install pinned uv and locked development dependencies
        working-directory: app
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.6
          uv sync --locked --python 3.13.5
      - name: Check Atlas freshness
        run: python designs/atlas/build.py --check
      - name: Check, build and verify installed wheel
        working-directory: app
        run: .venv/bin/python tooling/release.py --output "$RUNNER_TEMP/agent-playbook-release"
