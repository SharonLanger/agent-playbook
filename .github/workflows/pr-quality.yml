name: PR quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: PR quality
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node 24)
        with:
          python-version: '3.13.5'
      - name: Install pinned uv and locked development dependencies
        working-directory: app
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.6
          uv sync --locked --python 3.13.5
      - name: Check Atlas freshness
        run: python designs/atlas/build.py --check
      - name: Check, build and verify installed wheel
        working-directory: app
        run: .venv/bin/python tooling/release.py --output "$RUNNER_TEMP/agent-playbook-release"
